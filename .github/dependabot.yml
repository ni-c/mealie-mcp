version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Lockstep packages: bumped separately they arrive as individually broken PRs.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint declares a peer range of typescript ">=4.8.4 <6.1.0",
      # so TypeScript 7 cannot be installed here at all — npm aborts with
      # ERESOLVE. Revisit when typescript-eslint widens the range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The docs site has its own manifest so VitePress never enters the root
  # install. Its updates are excluded from auto-merge — docs.yml is path
  # filtered and cannot be a required check.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Exists so the digest-pinned base image gets refreshed at all. Node majors are
  # excluded because Dependabot offers whatever tag is newest, while the runtime
  # image has to sit on an ACTIVE LTS line — and roughly half of all Node majors
  # never become LTS. Crossing an LTS boundary is a decision, not an update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot but must always
      # move together — a version mismatch kills the codeql job.
      codeql:
        patterns:
          - github/codeql-action*
