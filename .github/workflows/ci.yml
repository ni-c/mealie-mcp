# There is deliberately no publish job here yet: the container image is built and
# scanned on every run, but nothing is pushed to GHCR and nothing is released to
# npm while this repository is private and untagged. The publish and release
# workflows land together with the first release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, so the audit job also runs in quiet weeks.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The two current LTS lines as of 2026-08-18. Node 26 exists but is a
        # current release, not LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
        if: matrix.node-version != 24
      - run: npm run test:coverage
        if: matrix.node-version == 24
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == 24
        with:
          name: coverage
          path: coverage/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: an audit must not execute the code it is auditing.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # init and analyze must always move together — see the dependabot codeql group.
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          # 201 rules instead of the default 87. On the sister repos this found
          # exactly one real bug and then stayed quiet, which is the right ratio.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  container-scan:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: 'mealie-mcp:audit-${{ matrix.tag }}'
          cache-from: type=gha,scope=scan-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.tag }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin Trivy itself: the action's default has been a release that was
          # withdrawn upstream, and the installer then dies after "found version".
          version: v0.74.0
          image-ref: 'mealie-mcp:audit-${{ matrix.tag }}'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
